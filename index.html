<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Invoice</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  body{
    min-height:100vh;
    background: linear-gradient(135deg,#eef5ff 0%, #d6e7ff 50%, #ffffff 100%);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    background:white;
    width:100%;max-width:420px;
    border-radius:24px;
    padding:32px;
    box-shadow:0 20px 60px rgba(37,99,235,0.15);
    border:1px solid #e0eaff;
  }
  .logo{
    width:56px;height:56px;background:linear-gradient(135deg,#2563eb,#3b82f6);
    border-radius:16px;display:flex;align-items:center;justify-content:center;
    color:white;font-weight:700;font-size:22px;margin-bottom:20px;
  }
  h1{font-size:26px;color:#0f172a;margin-bottom:6px}
  p.sub{color:#64748b;font-size:14px;margin-bottom:28px}
  label{font-size:13px;font-weight:600;color:#334155;margin-bottom:8px;display:block}
  .input-group{position:relative;margin-bottom:18px}
  .input-group input{
    width:100%;padding:16px 16px 16px 44px;
    border:2px solid #e2e8f0;border-radius:14px;
    font-size:15px;outline:none;transition:0.2s;
    background:#f8fafc;
  }
  .input-group input:focus{
    border-color:#3b82f6;background:white;
    box-shadow:0 0 0 4px rgba(59,130,246,0.12);
  }
  .input-group span{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    font-size:18px;color:#94a3b8;
  }
  input::placeholder{color:#94a3b8}
  .amount-box{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
    border-radius:16px;padding:16px;color:white;
    display:flex;justify-content:space-between;align-items:center;
    margin:10px 0 22px 0;
  }
  .amount-box small{opacity:0.8;font-size:12px}
  .amount-box b{font-size:20px}
  button.pay-btn{
    width:100%;padding:17px;
    background:linear-gradient(135deg,#1d4ed8,#3b82f6);
    color:white;border:none;border-radius:14px;
    font-size:16px;font-weight:700;cursor:pointer;
    box-shadow:0 10px 25px rgba(37,99,235,0.3);
    transition:0.2s;
  }
  button.pay-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(37,99,235,0.4)}
  button.pay-btn:active{transform:translateY(0)}
  .secure{
    margin-top:16px;text-align:center;
    font-size:12px;color:#94a3b8;display:flex;
    align-items:center;justify-content:center;gap:6px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">₦</div>
  <h1>Card Billing</h1>
  <p class="sub">Fast, safe & encrypted card payment powered by DeusTech.</p>
  
  <label>Client Email</label>
  <div class="input-group">
    <span>✉️</span>
    <input id="email" type="email" placeholder="e.g. client@gmail.com" />
  </div>

  <label>Amount (NGN)</label>
  <div class="input-group">
    <span>💳</span>
    <input id="amount" type="number" placeholder="e.g. 50,000" />
  </div>

  <label>Description</label>
  <div class="input-group">
    <span>📝</span>
    <input id="desc" type="text" placeholder="e.g. Car Deposit / Service Fee" />
  </div>

  <div class="amount-box">
    <div>
      <small>You'll be charged</small><br>
      <b id="preview">₦0</b>
    </div>
    <div style="font-size:24px">🔒</div>
  </div>

  <button class="pay-btn" onclick="pay()">Pay With Card ➪</button>
  
  <div class="secure">🔐 Secured by Paystack • Bank-grade encryption</div>
</div>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
  const amtInput = document.getElementById('amount');
  const preview = document.getElementById('preview');
  amtInput.addEventListener('input',()=>{
    let v = Number(amtInput.value || 0);
    preview.textContent = '₦' + v.toLocaleString();
  });

  function pay(){
    let email = document.getElementById('email').value;
    let amount = document.getElementById('amount').value;
    let desc = document.getElementById('desc').value;
    if(!email || !amount){ alert('Please fill email and amount'); return; }
    PaystackPop.setup({
      key: 'pk_live_8940d23e3be7b6fd0ce5ee1386edc4f623ccffcc',
      email: email,
      amount: amount * 100,
      currency: 'NGN',
      metadata: { custom_fields: [{display_name: "Description", variable_name: "description", value: desc}] },
      callback: function(res){ 
        alert('Payment Successful! Ref: ' + res.reference + '\n' + desc);
      },
      onClose: function(){ console.log('closed') }
    }).openIframe();
  }
</script>
</body>
</html>
